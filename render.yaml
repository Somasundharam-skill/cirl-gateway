services:
  - type: web
    name: cirl-gateway
    runtime: python
    plan: free
    # Python version is pinned in .python-version
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GATEWAY_API_KEY
        sync: false
      - key: EMPLOYEE_DIRECTORY_PATH
        value: data/employees.csv
      # Web-chat testing only. Never set in production.
      - key: TEST_PHONE
        sync: false
      - key: SESSION_TTL_MINUTES
        value: "60"
      - key: LOG_LEVEL
        value: INFO
      - key: CIRL_MODE_SEND_OTP
        value: mock
      - key: CIRL_MODE_VERIFY_OTP
        value: mock
      - key: CIRL_MODE_GET_LIST_OF_POLICY
        value: mock
